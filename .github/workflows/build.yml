name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-x64:
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [x64]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup vcpkg cache
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cache/vcpkg
          ${{ github.workspace }}/vcpkg_installed
        key: ${{ runner.os }}-vcpkg-x64-${{ hashFiles('vcpkg.json') || 'static-v1' }} # или фиксированный ключ
        restore-keys: |
          ${{ runner.os }}-vcpkg-x64-

    - name: Install Boost via vcpkg
      run: |
        vcpkg install boost-system boost-program-options boost-filesystem --triplet x64-windows-static --x-install-root="${{ github.workspace }}/vcpkg_installed"
  
    - name: Configure CMake
      run: >
        cmake -A x64 -S . -B ./build 
        -DCMAKE_GENERATOR_TOOLSET=v143 
        -D_WIN32_WINNT=0x0601 
        -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
        -DVCPKG_TARGET_TRIPLET=x64-windows-static
        -DCMAKE_PREFIX_PATH="${{ github.workspace }}/vcpkg_installed/x64-windows-static"

    - name: Build Release
      run: cmake --build ./build --config Release --target ALL_BUILD -j 6

    - name: Rename executables (x64)
      run: |
        Rename-Item -Path "build/application/data-logger/Release/data-logger.exe" -NewName "data-logger-windows-x64.exe"
        Rename-Item -Path "build/application/data-converter/Release/data-converter.exe" -NewName "data-converter-windows-x64.exe"
      shell: pwsh

    - name: Upload artifacts (x64)
      uses: actions/upload-artifact@v7
      with:
        name: pci-1716-binaries-x64
        path: |
          build/application/data-logger/Release/data-logger-windows-x64.exe
          build/application/data-converter/Release/data-converter-windows-x64.exe

  build-x86:
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [Win32]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup vcpkg cache
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cache/vcpkg
          ${{ github.workspace }}/vcpkg_installed
        key: ${{ runner.os }}-vcpkg-x86-${{ hashFiles('vcpkg.json') || 'static-v1' }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-x86-

    - name: Install Boost via vcpkg
      run: |
        vcpkg install boost-system boost-program-options boost-filesystem --triplet x86-windows-static --x-install-root="${{ github.workspace }}/vcpkg_installed"

    - name: Configure CMake
      run: >
        cmake -A Win32 -S . -B ./build 
        -DCMAKE_GENERATOR_TOOLSET=v143 
        -D_WIN32_WINNT=0x0601 
        -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
        -DVCPKG_TARGET_TRIPLET=x86-windows-static
        -DCMAKE_PREFIX_PATH="${{ github.workspace }}/vcpkg_installed/x86-windows-static"

    - name: Build Release
      run: cmake --build ./build --config Release --target ALL_BUILD -j 6

    - name: Rename executables (x86)
      run: |
        Rename-Item -Path "build/application/data-logger/Release/data-logger.exe" -NewName "data-logger-windows-i386.exe"
        Rename-Item -Path "build/application/data-converter/Release/data-converter.exe" -NewName "data-converter-windows-i386.exe"
      shell: pwsh

    - name: Upload artifacts (x86)
      uses: actions/upload-artifact@v7
      with:
        name: pci-1716-binaries-x86
        path: |
          build/application/data-logger/Release/data-logger-windows-i386.exe
          build/application/data-converter/Release/data-converter-windows-i386.exe

  build-xp:
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [Win32]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install v141_xp Toolset
      shell: powershell
      run: |
        $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
        $vsInstance = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
        
        Write-Host "1. Forcing Visual Studio Installer update..."
        $updateProcess = Start-Process -FilePath $installer -ArgumentList "update --passive --norestart" -Wait -PassThru
        
        Write-Host "2. Installing v141 toolset and Windows XP add-on..."
        # Нам нужны: Core-компоненты C++, сам компилятор v141 и пакет XP
        $args = @(
            "modify",
            "--installPath", "`"$vsInstance`"",
            "--add", "Microsoft.VisualStudio.Component.VC.CoreIde",
            "--add", "Microsoft.VisualStudio.Component.VC.v141.x86.x64",
            "--add", "Microsoft.VisualStudio.Component.WinXP",
            "--passive",
            "--norestart",
            "--nocache"
        )
        
        $process = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
        
        Write-Host "VS installation exit code: $($process.ExitCode)"
        
        # Codes 0 (success) and 3010 (success, reboot required) are valid
        if ($process.ExitCode -eq 0 -or $process.ExitCode -eq 3010) {
            Write-Host "v141_xp components successfully integrated into Visual Studio 2022!"
        } else {
            Write-Error "Installation failed. Check VS installation logs."
            exit $process.ExitCode
        }

    - name: Create custom XP triplet
      run: |
        # Создаем кастомный триплет локально в рабочей папке
        New-Item -ItemType Directory -Path "./custom-triplets" -Force | Out-Null
        $TripletContent = @"
        set(VCPKG_TARGET_ARCHITECTURE x86)
        set(VCPKG_CRT_LINKAGE static)
        set(VCPKG_LIBRARY_LINKAGE static)
        set(VCPKG_PLATFORM_TOOLSET v141_xp)
        "@
        Set-Content -Path "./custom-triplets/x86-windows-xp.cmake" -Value $TripletContent
      shell: pwsh

    - name: Setup vcpkg cache
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cache/vcpkg
          ${{ github.workspace }}/vcpkg_installed
        key: ${{ runner.os }}-vcpkg-xp-${{ hashFiles('vcpkg.json') || 'static-v1' }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-xp-

    - name: Download Legacy vcpkg Ports via ZIP (XP Compatible)
      shell: powershell
      run: |
        Write-Host "Скачивание среза портов vcpkg (конец 2022 года) через curl..."
        
        # Ссылка на архив конкретного коммита реестра (14 ноября 2022), где Boost 1.80.0 стабилен под XP
        $Url = "https://github.com"
        $ZipPath = "./vcpkg-legacy.zip"
        
        # Флаг -L обрабатывает редиректы серверов GitHub, -o указывает выходной файл
        curl.exe -L $Url -o $ZipPath
        
        # Проверяем размер скачанного файла, чтобы убедиться в успехе
        $fileSize = (Get-Item $ZipPath).Length
        Write-Host "Размер скачанного архива: $fileSize байт"
        if ($fileSize -lt 1000) {
            Write-Error "Файл скачался некорректно (слишком маленький размер)."
            exit 1
        }
        
        Write-Host "Распаковка портов..."
        Expand-Archive -Path $ZipPath -DestinationPath "./vcpkg-extracted" -Force
        
        # Переименовываем корневую папку из архива в наш рабочий каталог
        Move-Item -Path "./vcpkg-extracted/vcpkg-8064972e212fa9202579df20af3104fb472097b6" -Destination "./vcpkg-legacy-ports"
        
        Write-Host "Старые порты успешно подготовлены!"

    - name: Install Boost via vcpkg (XP triplet)
      shell: cmd
      run: |
        :: 1. Инициализируем окружение v141_xp
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86 -vcvars_ver=14.16
        
        :: 2. Запускаем установку. Порты уже гарантированно лежат на диске
        vcpkg install boost-system boost-program-options boost-filesystem --vcpkg-root="C:\vcpkg" --triplet=x86-windows-xp --overlay-triplets="./custom-triplets" --overlay-ports="./vcpkg-legacy-ports/ports" --x-install-root="%GITHUB_WORKSPACE%/vcpkg_installed"

    - name: Build Release for Windows XP
      run: cmake --build ./build-xp --config Release --target ALL_BUILD -j 4

    - name: Rename executables (XP)
      run: |
        Rename-Item -Path "build-xp/application/data-logger/Release/data-logger.exe" -NewName "data-logger-windows-xp.exe"
        Rename-Item -Path "build-xp/application/data-converter/Release/data-converter.exe" -NewName "data-converter-windows-xp.exe"
      shell: pwsh

    - name: Upload artifacts (XP)
      uses: actions/upload-artifact@v7
      with:
        name: pci-1716-binaries-xp
        path: |
          build-xp/application/data-logger/Release/data-logger-windows-xp.exe
          build-xp/application/data-converter/Release/data-converter-windows-xp.exe

  release:
    needs: [build-x64, build-x86, build-xp]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download artifacts (x64)
      uses: actions/download-artifact@v8
      with:
        name: pci-1716-binaries-x64
        path: binaries/x64

    - name: Download artifacts (x86)
      uses: actions/download-artifact@v8
      with:
        name: pci-1716-binaries-x86
        path: binaries/x86

    - name: Download artifacts (XP)
      uses: actions/download-artifact@v8
      with:
        name: pci-1716-binaries-xp
        path: binaries/xp

    - name: Flatten artifact directories
      run: |
        find binaries -type f -name "*.exe" -exec mv -v {} binaries/ \;
        rm -rf binaries/x64 binaries/x86 binaries/xp
      shell: bash

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          binaries/*-windows-x64.exe
          binaries/*-windows-i386.exe
          binaries/*-windows-xp.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
