name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-x64:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg integrate install
        .\vcpkg\vcpkg install boost-system boost-program-options boost-filesystem --triplet x64-windows

    - name: Configure CMake
      run: cmake -B build -A x64 -DCMAKE_TOOLCHAIN_FILE=./vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build Release
      run: cmake --build build --config Release

    - name: Upload artifacts (x64)
      uses: actions/upload-artifact@v4
      with:
        name: pci-1716-binaries-x64
        path: |
          build/application/data-logger/Release/data-logger.exe
          build/application/data-converter/Release/data-converter.exe

  build-x86:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [Win32]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg integrate install
        .\vcpkg\vcpkg install boost-system boost-program-options boost-filesystem --triplet x86-windows

    - name: Configure CMake
      run: cmake -B build -A Win32 -DCMAKE_TOOLCHAIN_FILE=./vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build Release
      run: cmake --build build --config Release

    - name: Upload artifacts (x86)
      uses: actions/upload-artifact@v4
      with:
        name: pci-1716-binaries-x86
        path: |
          build/application/data-logger/Release/data-logger.exe
          build/application/data-converter/Release/data-converter.exe

  release:
    needs: [build-x64, build-x86]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download artifacts (x64)
      uses: actions/download-artifact@v4
      with:
        name: pci-1716-binaries-x64
        path: binaries/x64

    - name: Download artifacts (x86)
      uses: actions/download-artifact@v4
      with:
        name: pci-1716-binaries-x86
        path: binaries/x86

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          binaries/x64/*.exe
          binaries/x86/*.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
