name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-x64:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Boost
      id: install-boost
      uses: MarkusJx/install-boost@v2.6.0 
      with:
        boost_version: 1.88.0
        platform_version: 2022
        toolset: msvc
        link: static
        arch: x86

    - name: Configure CMake
      run: cmake -G "Visual Studio 17 2022" -A x64 -S . -B ./build -DCMAKE_GENERATOR_TOOLSET=v143 -D_WIN32_WINNT=0x0601 -DBoost_INCLUDE_DIR=${{steps.install-boost.outputs.BOOST_ROOT}}/include -DBoost_LIBRARY_DIRS=${{steps.install-boost.outputs.BOOST_ROOT}}/lib
      env:
        BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}

    - name: Build Release
      run: cmake --build ./build --config Release --target ALL_BUILD -j 6

    - name: Upload artifacts (x64)
      uses: actions/upload-artifact@v7
      with:
        name: pci-1716-binaries-x64
        path: |
          build/application/data-logger/Release/data-logger.exe
          build/application/data-converter/Release/data-converter.exe

  build-x86:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [Win32]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Boost
      id: install-boost
      uses: MarkusJx/install-boost@v2.6.0      
      with:
        boost_version: 1.87.0
        platform_version: 2022
        toolset: msvc
        link: static
        arch: x86

    - name: Configure CMake
      run: cmake -A Win32 -S . -B ./build -DCMAKE_GENERATOR_TOOLSET=v143 -D_WIN32_WINNT=0x0601 -DBoost_INCLUDE_DIR=${{steps.install-boost.outputs.BOOST_ROOT}}/include -DBoost_LIBRARY_DIRS=${{steps.install-boost.outputs.BOOST_ROOT}}/lib
      env:
        BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}

    - name: Build Release
      run: cmake --build ./build --config Release --target ALL_BUILD -j 6

    - name: Upload artifacts (x86)
      uses: actions/upload-artifact@v7
      with:
        name: pci-1716-binaries-x86
        path: |
          build/application/data-logger/Release/data-logger.exe
          build/application/data-converter/Release/data-converter.exe

  release:
    needs: [build-x64, build-x86]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download artifacts (x64)
      uses: actions/download-artifact@v8
      with:
        name: pci-1716-binaries-x64
        path: binaries/x64

    - name: Download artifacts (x86)
      uses: actions/download-artifact@v8
      with:
        name: pci-1716-binaries-x86
        path: binaries/x86

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          binaries/x64/*.exe
          binaries/x86/*.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
